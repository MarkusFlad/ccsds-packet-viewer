[package]
name = "ccsds-web"
description = "WebAssembly frontend rendering CCSDS Space Packets in the browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ccsds-common = { path = "../ccsds-common" }
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "DomTokenList",
  "Element",
  "HtmlElement",
  "Node",
  "DomRect",
  "Event",
  "EventTarget",
  "MouseEvent",
  "Response",
  "CssStyleDeclaration",
  "KeyboardEvent",
  "Location",
  "Text",
]
