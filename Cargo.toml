[workspace]
resolver = "2"
members = ["crates/ccsds-common", "crates/ccsds-viewer", "crates/ccsds-web"]
default-members = ["crates/ccsds-common", "crates/ccsds-viewer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release.package.ccsds-web]
opt-level = "s"
